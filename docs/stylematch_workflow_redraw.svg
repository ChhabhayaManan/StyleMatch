<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#34495e" />
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #1f2937; }
      .node { stroke: #2c3e50; stroke-width: 3; rx: 14; ry: 14; }
