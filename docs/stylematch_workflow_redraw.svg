<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1300" viewBox="0 0 2200 1300">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#334155" />
    </marker>
    <style>
      .title-main { font: 700 52px 'Inter', Arial, sans-serif; fill: #0f172a; }
      .title-sub { font: 600 26px 'Inter', Arial, sans-serif; fill: #334155; }
      .node-title { font: 700 26px 'Inter', Arial, sans-serif; fill: #0f172a; }
      .node-sub { font: 500 19px 'Inter', Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 24px 'Inter', Arial, sans-serif; fill: #1e293b; }
      .state-text { font: 500 21px 'Inter', Arial, sans-serif; fill: #1f2937; }
      .edge-label { font: 600 18px 'Inter', Arial, sans-serif; fill: #334155; }
      .edge { stroke: #334155; stroke-width: 4.5; fill: none; marker-end: url(#arrow); }
      .thin-edge { stroke: #64748b; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Plain background -->
  <rect x="0" y="0" width="2200" height="1300" fill="#ffffff"/>

  <!-- Heading called Image -->
  <text x="70" y="85" class="title-main">Image</text>
  <text x="70" y="125" class="title-sub">StyleMatch End-to-End Workflow (Redrawn, Expanded Layout)</text>

  <!-- Main pipeline panel -->
  <rect x="440" y="170" width="1710" height="860" rx="24" ry="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="470" y="210" class="panel-title">Main Processing Pipeline</text>

  <!-- Utility/Data panel -->
  <rect x="70" y="170" width="330" height="520" rx="20" ry="20" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <text x="95" y="210" class="panel-title">ImageState</text>
  <text x="95" y="250" class="state-text">• img</text>
  <text x="95" y="284" class="state-text">• prompt</text>
  <text x="95" y="318" class="state-text">• segmented_imgs</text>
  <text x="95" y="352" class="state-text">• boxes</text>
  <text x="95" y="386" class="state-text">• products</text>
  <text x="95" y="420" class="state-text">• nearest_items</text>
  <text x="95" y="454" class="state-text">• errors</text>
  <text x="95" y="488" class="state-text">• html_shopping</text>
  <text x="95" y="522" class="state-text">• productShoppingInfos</text>

  <!-- Top row nodes (more spacing) -->
  <rect x="500" y="270" width="180" height="92" rx="18" ry="18" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="560" y="327" class="node-title">Start</text>

  <rect x="760" y="260" width="350" height="112" rx="20" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="834" y="315" class="node-title">Segmentation Agent</text>
  <text x="895" y="343" class="node-sub">(SAM3)</text>

  <rect x="1210" y="260" width="370" height="112" rx="20" ry="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="1280" y="315" class="node-title">InfoRetrievalAgent</text>
  <text x="1326" y="343" class="node-sub">(CLIP + FAISS)</text>

  <rect x="1690" y="260" width="410" height="112" rx="20" ry="20" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="1768" y="315" class="node-title">ProductRecognition</text>
  <text x="1783" y="343" class="node-sub">(MLLM + prompt/schema)</text>

  <!-- Middle row -->
  <rect x="1330" y="500" width="320" height="100" rx="18" ry="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="1410" y="558" class="node-title">LabellingAgent</text>

  <rect x="880" y="500" width="320" height="100" rx="18" ry="18" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="970" y="558" class="node-title">ShoppingInfo</text>

  <!-- Bottom row -->
  <rect x="880" y="740" width="320" height="100" rx="18" ry="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="972" y="798" class="node-title">HTML Block</text>

  <rect x="1330" y="740" width="320" height="100" rx="18" ry="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="1412" y="798" class="node-title">StopWorkflow</text>

  <rect x="1770" y="740" width="180" height="100" rx="18" ry="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="1830" y="798" class="node-title">Stop</text>

  <!-- Main flow arrows -->
  <path class="edge" d="M680 316 L760 316"/>
  <text x="690" y="288" class="edge-label">img, prompt</text>

  <path class="edge" d="M1110 316 L1210 316"/>
  <text x="1120" y="288" class="edge-label">boxes, seg_imgs</text>

  <path class="edge" d="M1580 316 L1690 316"/>
  <text x="1590" y="288" class="edge-label">nearest_items</text>

  <path class="edge" d="M1895 372 L1495 500"/>
  <text x="1700" y="445" class="edge-label">product</text>

  <path class="edge" d="M1330 550 L1200 550"/>
  <text x="1215" y="522" class="edge-label">img (labelled)</text>

  <path class="edge" d="M1040 600 L1040 740"/>
  <text x="1060" y="680" class="edge-label">shopping info</text>

  <path class="edge" d="M1200 790 L1330 790"/>
  <text x="1220" y="762" class="edge-label">HTML blocks</text>

  <path class="edge" d="M1650 790 L1770 790"/>

  <!-- Supporting components panel -->
  <rect x="70" y="730" width="780" height="300" rx="20" ry="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="95" y="770" class="panel-title">Supporting Components</text>

  <rect x="100" y="800" width="180" height="78" rx="14" ry="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="170" y="848" class="node-sub">WebScraper</text>

  <rect x="310" y="800" width="200" height="78" rx="14" ry="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="352" y="848" class="node-sub">sellerLogoUrl</text>

  <rect x="540" y="800" width="280" height="78" rx="14" ry="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="578" y="838" class="node-sub">ShoppingInfo schema</text>
  <text x="618" y="862" class="node-sub">(pydantic validation)</text>

  <rect x="100" y="910" width="180" height="78" rx="14" ry="14" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
  <text x="165" y="958" class="node-sub">SAM3</text>

  <rect x="310" y="910" width="180" height="78" rx="14" ry="14" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
  <text x="380" y="958" class="node-sub">CLIP</text>

  <rect x="520" y="910" width="140" height="78" rx="14" ry="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="565" y="958" class="node-sub">FAISS</text>

  <rect x="690" y="910" width="130" height="78" rx="14" ry="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="732" y="945" class="node-sub">JSON</text>
  <text x="730" y="968" class="node-sub">index</text>

  <!-- Connector lines to supporting panel -->
  <path class="thin-edge" d="M940 372 L190 910"/>
  <path class="thin-edge" d="M1395 372 L395 910"/>
  <path class="thin-edge" d="M1485 372 L590 910"/>
  <path class="thin-edge" d="M1535 372 L755 910"/>
  <path class="thin-edge" d="M1040 550 L190 800"/>
  <path class="thin-edge" d="M1040 550 L410 800"/>
  <path class="thin-edge" d="M1040 550 L680 800"/>

  <!-- Footer legend -->
  <rect x="440" y="1060" width="1710" height="170" rx="20" ry="20" fill="#ffffff" stroke="#d1d5db" stroke-width="1.8"/>
  <text x="470" y="1102" class="panel-title">Legend</text>

  <rect x="470" y="1120" width="42" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="525" y="1138" class="edge-label">Core workflow agents</text>

  <rect x="820" y="1120" width="42" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="875" y="1138" class="edge-label">Retrieval/Data components</text>

  <rect x="1270" y="1120" width="42" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1325" y="1138" class="edge-label">LLM recognition stage</text>

  <rect x="1630" y="1120" width="42" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1685" y="1138" class="edge-label">Workflow termination stage</text>
</svg>
