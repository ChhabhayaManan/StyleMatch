      .small { font: 18px Arial, sans-serif; fill: #374151; }
      .edge { stroke: #34495e; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="620" y="45" class="title">StyleMatch Workflow (Redraw from Hand Sketch)</text>

