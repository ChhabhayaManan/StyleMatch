  <rect x="50" y="290" width="330" height="260" rx="12" ry="12" fill="#fafafa" stroke="#9ca3af" stroke-width="2"/>
  <text class="txt" x="70" y="324">ImageState</text>
  <text class="small" x="70" y="355">- img</text>
  <text class="small" x="70" y="380">- prompt</text>
  <text class="small" x="70" y="405">- segmented_imgs, boxes</text>
